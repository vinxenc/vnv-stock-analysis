# The hook runs the project copy (uv dev dependency), not whatever lefthook its fallback list finds first
lefthook: uv run lefthook

pre-commit:
  commands:
    format:
      glob: "*.py"
      run: uv run ruff format --force-exclude {staged_files}  # --force-exclude: honour pyproject's exclude for a named file
      stage_fixed: true
    lint:
      run: uv run ruff check libs scripts tests research
    test:
      run: uv run pytest
