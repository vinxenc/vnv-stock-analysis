# Local Postgres for development: `docker compose up -d --wait`
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: vnv
      POSTGRES_PASSWORD: vnv
      POSTGRES_DB: vnv
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vnv"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
