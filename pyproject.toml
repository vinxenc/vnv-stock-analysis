[project]
name = "vnv-stock-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.107",
    "pydantic>=2",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.6", "pip-audit>=2.7"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: hits the real endpoints (run with `uv run pytest -m live --no-cov`)"]
addopts = "--import-mode=importlib -m 'not live' --cov=libs --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
