[project]
name = "vnv-stock-analysis"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "holidays>=0.107",
    "logxide>=0.3.0",
    "niquests>=3.21.2",
    "psycopg[binary]>=3.3.6",
    "pydantic>=2",
    "sqlmodel>=0.0.48",
    "tenacity>=9.2.1",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
    "pip-audit>=2.7",
    "alembic>=1.20.1",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["live: hits the real endpoints (run with `uv run pytest -m live --no-cov`)"]
addopts = "--import-mode=importlib -m 'not live' --cov=libs --cov=scripts --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
branch = true

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN"]
