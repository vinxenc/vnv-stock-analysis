name: VN Stock Prices Sync

on:
  schedule:
    # 14:45 giờ VN (UTC+7) = 07:45 UTC, thứ 2 - thứ 6. vn-stock-analysis.yml chạy lúc 15:45, sau khi giá đã được lưu
    - cron: "45 7 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time: an overlapping run could store bars it fetched before another run re-stored an ex-rights history
concurrency:
  group: vn-stock-prices-sync
  cancel-in-progress: false

jobs:
  start-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: echo "start pipeline vn stock prices sync"
      - if: always()
        uses: ./.github/actions/pipeline-state
        with:
          pipeline: start-analyze
          job-status: ${{ job.status }}
          success-message: Pipeline started
          failure-message: Pipeline could not start

  # Runs first and fills the uv cache (keyed on uv.lock); the jobs below restore it.
  install:
    name: Install dependencies
    needs: start-analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
        with:
          save-cache: true
      - if: always()
        uses: ./.github/actions/pipeline-state
        with:
          pipeline: install
          job-status: ${{ job.status }}
          success-message: Dependencies installed
          failure-message: Pipeline failed, can not install dependencies

  # The sessions to fetch: from the working day after the newest row of vn_stock_price_sync_history to the newest
  # closed session, not the wall-clock day, so a run GitHub delays past midnight still fetches the right one and a
  # run after a failed one catches every missed session up. Its `sessions` output (`first..last`, empty when nothing
  # is due: a day off, or the newest session already stored) is the SESSIONS of every job below; a rerun of a failed
  # job keeps it.
  next_session:
    needs: install
    runs-on: ubuntu-latest
    environment: production  # DATABASE_URL is an environment secret, limited to master
    outputs:
      sessions: ${{ steps.next.outputs.sessions }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - name: Find the sessions due
        id: next
        # writes sessions=YYYY-MM-DD..YYYY-MM-DD to $GITHUB_OUTPUT, nothing when nothing is due
        run: uv run --no-sync python -m scripts.vn_stock_price_sync_session
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - if: always()
        uses: ./.github/actions/pipeline-state
        with:
          pipeline: next_session
          job-status: ${{ job.status }}
          success-message: ${{ steps.next.outputs.sessions && format('Sessions due {0}', steps.next.outputs.sessions) || 'No session due (a day off, or already stored), pipeline will ignore' }}
          failure-message: Pipeline failed, can not find the sessions due
          success-level: ${{ steps.next.outputs.sessions && 'info' || 'warning' }}

  # Before the retrieval: the symbols whose ex-rights date (GDKHQ) falls from the first session to today get their
  # whole history (from 2019) re-stored as the source adjusts it. A failure stops the sync: the sessions stay due.
  dividend_history:
    name: vn stock dividend history
    needs: next_session
    if: needs.next_session.outputs.sessions != ''
    runs-on: ubuntu-latest
    timeout-minutes: 60
    environment: production  # DATABASE_URL is an environment secret, limited to master
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - name: Re-store the history of the sessions' ex-rights symbols
        run: uv run --no-sync python -m scripts.vn_stock_dividend_history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SESSIONS: ${{ needs.next_session.outputs.sessions }}
      - if: always()
        uses: ./.github/actions/pipeline-state
        with:
          pipeline: dividend_history
          job-status: ${{ job.status }}
          success-message: Re-stored the history of the sessions' ex-rights symbols
          failure-message: Pipeline failed, can not re-store the history of the sessions' ex-rights symbols

  retrieve_prices:
    name: vn stock latest price retrieval
    needs: [next_session, dividend_history]
    if: needs.next_session.outputs.sessions != ''
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - name: Retrieve latest prices
        # exits 0 with a JSON file of the sessions' bars, 4 when no session has bars of 90% of the symbols; else fails
        run: uv run --no-sync python -m scripts.vn_stock_latest_price_retrieval
        env:
          SESSIONS: ${{ needs.next_session.outputs.sessions }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vn-stock-latest-prices
          path: out/vn_stock_latest_prices.json
          retention-days: 7
          if-no-files-found: error
      - if: always()
        uses: ./.github/actions/pipeline-state
        with:
          pipeline: retrieve_prices
          job-status: ${{ job.status }}
          success-message: Retrieved the latest prices
          failure-message: Pipeline failed, can not retrieve any stock price data

  vn_stock_daily_price_store:
    name: vn stock daily price store
    needs: retrieve_prices
    runs-on: ubuntu-latest
    timeout-minutes: 10  # the script has its own database timeouts; this is the backstop
    environment: production  # DATABASE_URL is an environment secret, limited to master
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vn-stock-latest-prices
          path: out
      - name: Store prices (upsert)
        run: uv run --no-sync python -m scripts.vn_stock_daily_price_store
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - if: always()
        uses: ./.github/actions/pipeline-state
        with:
          pipeline: vn_stock_daily_price_store
          job-status: ${{ job.status }}
          success-message: Stored the prices in the database
          failure-message: Pipeline failed, can not store the prices in the database

  notification:
    needs: [start-analyze, install, next_session, dividend_history, retrieve_prices, vn_stock_daily_price_store]
    if: always()  # also after a failed or skipped job: it only reads the state files they wrote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: pipeline-state-*
          merge-multiple: true
          path: state
      - name: Log every pipeline state as an annotation
        env:
          NEEDS: ${{ toJSON(needs) }}  # fallback for a job that died before it could write its state
        # system python, not uv: it must still run when the dependencies could not be installed
        run: python3 -m scripts.notification state
