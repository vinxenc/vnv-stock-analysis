name: CI

on:
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Runs first and fills the uv cache (keyed on uv.lock); the jobs below restore it.
  install:
    name: Install dependencies
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          prune-cache: false  # pruning drops the pre-built wheels, leaving an empty cache
      - name: Install dependencies
        run: uv sync --locked

  lint:
    name: Ruff check
    needs: install
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false
          prune-cache: false  # part of the cache key: must match the install job to hit its cache
      - name: Install dependencies (from cache)
        run: uv sync --locked
      - name: Ruff check
        run: uv run ruff check libs scripts tests

  test:
    name: Unit tests + coverage
    needs: lint
    runs-on: ubuntu-latest
    env:  # read by the seed step and by pytest
      DATABASE_URL: postgresql+psycopg://vnv:vnv@127.0.0.1:5432/vnv  # the service's CI-only credentials
      SQL_LOG_ENABLE: "1"  # log every SQL statement (libs.db.log_sql)
    services:
      postgres:  # same server as docker-compose.yml; tests/conftest.py creates the vnv_test database
        image: postgres:17
        env:
          POSTGRES_USER: vnv
          POSTGRES_PASSWORD: vnv
          POSTGRES_DB: vnv
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U vnv" --health-interval 2s --health-retries 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false
          prune-cache: false  # part of the cache key: must match the install job to hit its cache
      - name: Install dependencies (from cache)
        run: uv sync --locked
      - name: Migrate and seed the database with real prices
        run: |
          uv run alembic upgrade head
          uv run python -m scripts.vn_stock_daily_price_store tests/data/prices_hpg_aam.json
      - name: Unit tests (coverage gate from pyproject.toml)
        run: uv run pytest -s  # -s: pytest would hide the SQL log of passing tests

  audit:
    name: Dependency vulnerability scan
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
          save-cache: false
          prune-cache: false  # part of the cache key: must match the install job to hit its cache
      - name: Install dependencies (from cache)
        run: uv sync --locked
      - name: Export locked runtime dependencies
        run: uv export --locked --no-dev --no-emit-project --no-hashes --quiet -o requirements-audit.txt
      - name: pip-audit
        run: uv run pip-audit -r requirements-audit.txt --no-deps --disable-pip
