name: CD

on:
  push:
    branches: [master]
    # a migration (seed migrations load data/seeds/*), or what runs it (this file, the install step): merging a fix for a failed run re-runs it
    paths: [migrations/**, data/seeds/**, .github/workflows/cd.yml, .github/actions/setup-env/**]
  workflow_dispatch:

# two merges in a row must not deploy at the same time, and a running deploy is never cancelled
concurrency:
  group: cd
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  migrate:
    name: Migrate database (schema and seed migrations)
    runs-on: ubuntu-latest
    environment: production  # DATABASE_URL is an environment secret, limited to master
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
        with:
          dev: 'true'  # alembic is a dev dependency
          save-cache: true
      - name: Run migrations
        run: uv run --no-sync alembic upgrade head
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
