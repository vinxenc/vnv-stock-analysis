name: VN Stock Analysis

on:
  schedule:
    # 15:45 giờ VN (UTC+7) = 08:45 UTC, thứ 2 - thứ 6
    - cron: "45 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: echo "start pipeline vn stock analysis"
      - if: always()
        uses: ./.github/actions/pipeline-state
        with:
          pipeline: start-analyze
          job-status: ${{ job.status }}
          success-message: Pipeline started
          failure-message: Pipeline could not start

  # Runs first and fills the uv cache (keyed on uv.lock); the jobs below restore it.
  install:
    name: Install dependencies
    needs: start-analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
        with:
          save-cache: true
      - if: always()
        uses: ./.github/actions/pipeline-state
        with:
          pipeline: install
          job-status: ${{ job.status }}
          success-message: Dependencies installed
          failure-message: Pipeline failed, can not install dependencies

  is_holiday:
    needs: install
    runs-on: ubuntu-latest
    outputs:
      holiday: ${{ steps.check.outputs.holiday }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - uses: ./.github/actions/check-holiday
        id: check
      - if: always()
        uses: ./.github/actions/pipeline-state
        with:
          pipeline: is_holiday
          job-status: ${{ job.status }}
          success-message: ${{ steps.check.outputs.holiday == 'true' && 'Today is Holiday, Pipeline will ignore' || 'Today is a working day' }}
          failure-message: Pipeline failed, can not check the holiday
          success-level: ${{ steps.check.outputs.holiday == 'true' && 'warning' || 'info' }}

  vn_stock_screen:
    name: vn stock screen
    needs: is_holiday
    if: needs.is_holiday.outputs.holiday == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 10  # the script has its own database timeouts; this is the backstop
    environment: production  # DATABASE_URL is an environment secret, limited to master
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - name: Screen the liquid symbols
        # exits 0 with a CSV, 4 when nobody is liquid enough; a stale session crashes; any non-zero code fails the job
        run: uv run --no-sync python -m scripts.vn_stock_screen
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vn-stock-screen
          path: out/liquid_symbols.csv
          retention-days: 7
          if-no-files-found: error
      - if: always()
        uses: ./.github/actions/pipeline-state
        with:
          pipeline: vn_stock_screen
          job-status: ${{ job.status }}
          success-message: Screened the liquid symbols
          failure-message: Pipeline failed, can not screen the liquid symbols (stale prices or none liquid)

  vn_stock_get_history:
    name: vn stock get history
    needs: vn_stock_screen
    runs-on: ubuntu-latest
    timeout-minutes: 10  # the script has its own database timeouts; this is the backstop
    environment: production  # DATABASE_URL is an environment secret, limited to master
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vn-stock-screen
          path: out
      - name: Read the history of the shortlist
        # exits 0 with one JSON per symbol, 4 when no symbol has a row; symbols with too few rows are only logged
        run: uv run --no-sync python -m scripts.vn_stock_get_history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vn-stock-history
          path: out/vn_stock_history
          retention-days: 7
          if-no-files-found: error
      - if: always()
        uses: ./.github/actions/pipeline-state
        with:
          pipeline: vn_stock_get_history
          job-status: ${{ job.status }}
          success-message: Read the price history of the shortlist
          failure-message: Pipeline failed, can not read the price history

  vn_stock_analyze:
    name: vn stock analyze
    needs: vn_stock_get_history
    runs-on: ubuntu-latest
    timeout-minutes: 10  # a few seconds of computing; no database, no network
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vn-stock-history
          path: out/vn_stock_history
      - name: Score the shortlist
        # exits 0 after writing the JSON and the ranked table to the job summary, 4 when there is no history
        run: uv run --no-sync python -m scripts.vn_stock_analyze
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vn-stock-analysis
          path: out/vn_stock_analysis.json
          retention-days: 7
          if-no-files-found: error
      - if: always()
        uses: ./.github/actions/pipeline-state
        with:
          pipeline: vn_stock_analyze
          job-status: ${{ job.status }}
          success-message: Scored the shortlist, ranking in the job summary
          failure-message: Pipeline failed, can not score the shortlist

  notification:
    needs: [start-analyze, install, is_holiday, vn_stock_screen, vn_stock_get_history, vn_stock_analyze]  # each job added to this workflow goes here too
    if: always()  # also after a failed or skipped job: it only reads the state files they wrote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: pipeline-state-*
          merge-multiple: true
          path: state
      - name: Log every pipeline state as an annotation
        env:
          NEEDS: ${{ toJSON(needs) }}  # fallback for a job that died before it could write its state
        # system python, not uv: it must still run when the dependencies could not be installed
        run: python3 -m scripts.notification state
