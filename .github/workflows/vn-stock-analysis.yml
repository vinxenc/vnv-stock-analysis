name: VN Stock Analysis

on:
  schedule:
    # 15:45 giờ VN (UTC+7) = 08:45 UTC, thứ 2 - thứ 6
    - cron: "45 8 * * 1-5"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  start-analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - run: echo "start pipeline vn stock analysis"
      - if: always()
        uses: ./.github/actions/pipeline-state
        with:
          pipeline: start-analyze
          job-status: ${{ job.status }}
          success-message: Pipeline started
          failure-message: Pipeline could not start

  # Runs first and fills the uv cache (keyed on uv.lock); the jobs below restore it.
  install:
    name: Install dependencies
    needs: start-analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
        with:
          save-cache: true
      - if: always()
        uses: ./.github/actions/pipeline-state
        with:
          pipeline: install
          job-status: ${{ job.status }}
          success-message: Dependencies installed
          failure-message: Pipeline failed, can not install dependencies

  vn_stock_screen:
    name: vn stock screen
    needs: install
    runs-on: ubuntu-latest
    timeout-minutes: 10  # the script has its own database timeouts; this is the backstop
    environment: production  # DATABASE_URL is an environment secret, limited to master
    outputs:
      screened: ${{ steps.screen.outputs.screened }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - name: Screen the liquid symbols
        id: screen
        # The script screens the working day after the newest row of vn_stock_screen_history, so it also covers a day off
        # and a run that GitHub delayed past midnight. Exit 0 = shortlist written, 5 = the next session is after today
        # (nothing to do, the jobs below are skipped); 4 (nobody liquid) or a crash (stale prices) fails the job.
        run: |
          rc=0
          uv run --no-sync python -m scripts.vn_stock_screen || rc=$?
          case "$rc" in
            0) echo "screened=true" >> "$GITHUB_OUTPUT" ;;
            5) echo "screened=false" >> "$GITHUB_OUTPUT" ;;
            *) exit "$rc" ;;
          esac
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - if: steps.screen.outputs.screened == 'true'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vn-stock-screen
          path: |
            out/liquid_symbols.csv
            out/screen_session.txt
          retention-days: 7
          if-no-files-found: error
      - if: always()
        uses: ./.github/actions/pipeline-state
        with:
          pipeline: vn_stock_screen
          job-status: ${{ job.status }}
          success-message: ${{ steps.screen.outputs.screened == 'true' && 'Screened the liquid symbols' || 'Nothing to screen yet, the next session is after today' }}
          failure-message: Pipeline failed, can not screen the liquid symbols (stale prices or none liquid)
          success-level: ${{ steps.screen.outputs.screened == 'true' && 'info' || 'warning' }}

  vn_stock_get_history:
    name: vn stock get history
    needs: vn_stock_screen
    if: needs.vn_stock_screen.outputs.screened == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10  # the script has its own database timeouts; this is the backstop
    environment: production  # DATABASE_URL is an environment secret, limited to master
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vn-stock-screen
          path: out
      - name: Read the history of the shortlist
        # exits 0 with one JSON per symbol, 4 when no symbol has a row; symbols with too few rows are only logged
        run: uv run --no-sync python -m scripts.vn_stock_get_history
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vn-stock-history
          path: out/vn_stock_history
          retention-days: 7
          if-no-files-found: error
      - if: always()
        uses: ./.github/actions/pipeline-state
        with:
          pipeline: vn_stock_get_history
          job-status: ${{ job.status }}
          success-message: Read the price history of the shortlist
          failure-message: Pipeline failed, can not read the price history

  vn_stock_analyze:
    name: vn stock analyze
    needs: vn_stock_get_history  # skipped with it: a skipped need skips its dependents
    runs-on: ubuntu-latest
    timeout-minutes: 10  # a few seconds of computing; the script has its own database timeouts
    environment: production  # DATABASE_URL is an environment secret, limited to master
    outputs:
      session: ${{ steps.session.outputs.session }}  # the day analysed, for vn_stock_decision_filter
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vn-stock-history
          path: out/vn_stock_history
      - name: Score the shortlist
        # exits 0 after writing the JSON, upserting the ranking into vn_stock_rankings and writing the ranked table to the
        # job summary, 4 when there is no history
        run: uv run --no-sync python -m scripts.vn_stock_analyze
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Read the session analysed
        id: session
        run: echo "session=$(jq -r .as_of out/vn_stock_analysis.json)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vn-stock-analysis
          path: out/vn_stock_analysis.json
          retention-days: 7
          if-no-files-found: error
      - if: always()
        uses: ./.github/actions/pipeline-state
        with:
          pipeline: vn_stock_analyze
          job-status: ${{ job.status }}
          success-message: Scored the shortlist, ranking stored and in the job summary
          failure-message: Pipeline failed, can not score the shortlist or store the ranking

  # Picks the day's candidates for the Phase 2 deciders (docs/plans/phase-2-llm-decision.md): the symbols scored 40 or
  # more with their last bars, as one JSON file. Not in vn_stock_screen_done's needs: a decider problem never leaves
  # the session due.
  vn_stock_decision_filter:
    name: vn stock decision filter
    needs: vn_stock_analyze  # skipped with it
    runs-on: ubuntu-latest
    timeout-minutes: 10  # a few seconds of reading two files; no database
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vn-stock-analysis
          path: out
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vn-stock-history
          path: out/vn_stock_history
      - name: Pick the candidates
        # exits 0 after writing the JSON (an empty list when nobody scores 40), 1 when the analysis is not of the session
        run: uv run --no-sync python -m scripts.vn_stock_decision_filter "$SESSION"
        env:
          SESSION: ${{ needs.vn_stock_analyze.outputs.session }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: vn-stock-decision-input
          path: out/vn_stock_decision_input.json
          retention-days: 7
          if-no-files-found: error
      - if: always()
        uses: ./.github/actions/pipeline-state
        with:
          pipeline: vn_stock_decision_filter
          job-status: ${{ job.status }}
          success-message: Picked the candidates for the deciders
          failure-message: Pipeline failed, can not pick the candidates for the deciders

  # Last, so a session that failed anywhere stays due and the next run redoes it.
  vn_stock_screen_done:
    name: vn stock screen done
    needs: [vn_stock_screen, vn_stock_analyze]
    if: needs.vn_stock_screen.outputs.screened == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10  # the script has its own database timeouts; this is the backstop
    environment: production  # DATABASE_URL is an environment secret, limited to master
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-env
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          name: vn-stock-screen
          path: out
      - name: Record the session in the screen history
        run: uv run --no-sync python -m scripts.vn_stock_screen_done
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - if: always()
        uses: ./.github/actions/pipeline-state
        with:
          pipeline: vn_stock_screen_done
          job-status: ${{ job.status }}
          success-message: Recorded the session in the screen history
          failure-message: Pipeline failed, can not record the session (it stays due and will be screened again)

  notification:
    needs: [start-analyze, install, vn_stock_screen, vn_stock_get_history, vn_stock_analyze, vn_stock_decision_filter, vn_stock_screen_done]  # each job added to this workflow goes here too
    if: always()  # also after a failed or skipped job: it only reads the state files they wrote
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7
        with:
          pattern: pipeline-state-*
          merge-multiple: true
          path: state
      - name: Log every pipeline state as an annotation
        env:
          NEEDS: ${{ toJSON(needs) }}  # fallback for a job that died before it could write its state
        # system python, not uv: it must still run when the dependencies could not be installed
        run: python3 -m scripts.notification state
